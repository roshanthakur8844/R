<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harmonica 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            perspective: 1200px;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .scene {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            position: relative;
            width: 520px;
            background: rgba(15, 15, 35, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 50px 40px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5), 0 0 100px rgba(0, 255, 150, 0.1);
            border: 2px solid rgba(0, 255, 150, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            animation: floatIn 0.8s ease;
        }

        @keyframes floatIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .title {
            color: #00ff9e;
            font-size: 32px;
            font-weight: 700;
            text-align: center;
            text-shadow: 0 0 20px rgba(0, 255, 158, 0.5);
            letter-spacing: 2px;
        }

        .harmonica-body {
            position: relative;
            width: 420px;
            height: 120px;
            background: linear-gradient(145deg, #1a1a2e, #0f3460);
            border-radius: 60px;
            box-shadow: 
                inset 0 10px 30px rgba(0,0,0,0.8),
                0 20px 50px rgba(0,0,0,0.6),
                0 0 50px rgba(0, 255, 150, 0.1);
            border: 2px solid rgba(0, 255, 150, 0.3);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .holes-container {
            display: flex;
            gap: 8px;
            padding: 0 25px;
            width: 100%;
            justify-content: center;
            position: relative;
            z-index: 2;
        }

        .hole {
            width: 38px;
            height: 70px;
            background: linear-gradient(135deg, #0a0a15, #1a1a2e);
            border: 2px solid #00ff9e;
            border-radius: 10px;
            position: relative;
            cursor: pointer;
            transition: all 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #00ff9e;
            font-weight: bold;
            box-shadow: inset 0 2px 5px rgba(0, 255, 158, 0.1);
        }

        .hole:hover {
            transform: translateY(-8px);
            box-shadow: 0 0 20px rgba(0, 255, 158, 0.4), inset 0 2px 5px rgba(0, 255, 158, 0.2);
            background: linear-gradient(135deg, #1a1a2e, #00ff9e15);
        }

        .hole.active {
            background: linear-gradient(135deg, #00ff9e30, #00ff9e10);
            border-color: #00ffff;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.6), inset 0 2px 5px rgba(0, 255, 158, 0.3);
            transform: scale(1.1);
        }

        .harmonica-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, transparent 0%, rgba(0, 255, 150, 0.05) 100%);
            top: 0;
            left: 0;
        }

        .mic-section {
            position: relative;
            width: 200px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mic-container {
            position: relative;
            width: 140px;
            height: 160px;
            background: linear-gradient(135deg, #ff006e, #8338ec);
            border-radius: 20px 20px 50px 50px;
            box-shadow: 0 20px 50px rgba(255, 0, 110, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 70px;
            animation: micPulse 2s ease-in-out infinite;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        @keyframes micPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .mic-container.active {
            animation: micPulseActive 0.3s ease-in-out infinite;
            background: linear-gradient(135deg, #ff0080, #ff6ec7);
        }

        @keyframes micPulseActive {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .sound-rings {
            position: absolute;
            width: 180px;
            height: 180px;
        }

        .ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid rgba(255, 0, 110, 0.3);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: ringPulse 1.5s ease-out infinite;
        }

        .ring:nth-child(2) {
            animation-delay: 0.5s;
        }

        .ring:nth-child(3) {
            animation-delay: 1s;
        }

        .ring.active {
            border-color: rgba(0, 255, 255, 0.6);
            animation: ringPulseActive 0.6s ease-out infinite;
        }

        .ring.active:nth-child(2) {
            animation-delay: 0.2s;
        }

        .ring.active:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes ringPulse {
            0% {
                transform: translate(-50%, -50%) scale(0.8);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) scale(1.3);
                opacity: 0;
            }
        }

        @keyframes ringPulseActive {
            0% {
                transform: translate(-50%, -50%) scale(0.8);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) scale(1.5);
                opacity: 0;
            }
        }

        .air-meter {
            width: 320px;
            height: 12px;
            background: rgba(0, 255, 150, 0.1);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(0, 255, 150, 0.3);
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }

        .air-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff006e, #00ff9e);
            width: 0%;
            transition: width 0.05s linear;
            box-shadow: 0 0 15px rgba(0, 255, 158, 0.8);
        }

        .controls {
            display: flex;
            gap: 20px;
            width: 100%;
            justify-content: center;
        }

        .btn {
            padding: 16px 32px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 2px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255,255,255,0.2);
            transition: left 0.3s;
            z-index: -1;
        }

        .btn:hover:not(:disabled)::before {
            left: 100%;
        }

        .start-btn {
            background: linear-gradient(135deg, #00ff9e, #00d4aa);
            color: #0f3460;
        }

        .start-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(0, 255, 158, 0.4);
        }

        .stop-btn {
            background: linear-gradient(135deg, #ff006e, #ff0090);
            color: white;
        }

        .stop-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(255, 0, 110, 0.4);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .info-panel {
            color: #00ff9e;
            text-align: center;
            font-size: 13px;
            min-height: 50px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .status {
            font-weight: 600;
            font-size: 15px;
            color: #00ffff;
        }

        .frequency-display {
            color: #ff006e;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .airflow-text {
            color: #00ff9e;
            font-size: 12px;
        }

        canvas {
            position: absolute !important;
            top: 0;
            left: 0;
            border-radius: 60px;
        }

        @media (max-width: 600px) {
            .container {
                width: 90%;
                padding: 30px 20px;
                gap: 25px;
            }
            
            .harmonica-body {
                width: 100%;
                height: 100px;
            }
            
            .hole {
                width: 32px;
                height: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="scene">
        <div class="container">
            <div class="title">🎼 HARMONICA 2026</div>
            
            <div class="harmonica-body">
                <canvas id="waveCanvas"></canvas>
                <div class="harmonica-glow"></div>
                <div class="holes-container">
                    <div class="hole" data-freq="262" data-note="C">C</div>
                    <div class="hole" data-freq="294" data-note="D">D</div>
                    <div class="hole" data-freq="330" data-note="E">E</div>
                    <div class="hole" data-freq="349" data-note="F">F</div>
                    <div class="hole" data-freq="392" data-note="G">G</div>
                    <div class="hole" data-freq="440" data-note="A">A</div>
                    <div class="hole" data-freq="494" data-note="B">B</div>
                    <div class="hole" data-freq="523" data-note="C">C</div>
                </div>
            </div>

            <div class="mic-section">
                <div class="sound-rings">
                    <div class="ring"></div>
                    <div class="ring"></div>
                    <div class="ring"></div>
                </div>
                <div class="mic-container">🎤</div>
            </div>

            <div class="air-meter">
                <div class="air-fill"></div>
            </div>

            <div class="controls">
                <button class="btn start-btn" id="startBtn">START</button>
                <button class="btn stop-btn" id="stopBtn" disabled>STOP</button>
            </div>

            <div class="info-panel">
                <div class="status" id="status">Ready to blow</div>
                <div class="frequency-display" id="frequency"></div>
                <div class="airflow-text" id="airflow">Air: 0%</div>
            </div>
        </div>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let mediaStream = null;
        let analyser = null;
        let isActive = false;
        let oscillators = [];
        let masterGain = null;

        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const statusDiv = document.getElementById('status');
        const freqDiv = document.getElementById('frequency');
        const airflowDiv = document.getElementById('airflow');
        const airFill = document.querySelector('.air-fill');
        const holes = document.querySelectorAll('.hole');
        const micContainer = document.querySelector('.mic-container');
        const rings = document.querySelectorAll('.ring');
        const canvas = document.getElementById('waveCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = 420;
        canvas.height = 120;

        function playNote(freq, intensity) {
            // Stop all previous oscillators
            stopNote();

            if (intensity < 0.1) return;

            if (!masterGain) {
                masterGain = audioCtx.createGain();
                masterGain.connect(audioCtx.destination);
            }

            masterGain.gain.setValueAtTime(Math.min(intensity * 0.2, 0.3), audioCtx.currentTime);

            // Create warm harmonica tone with harmonics
            const baseFreqs = [freq, freq * 2, freq * 3, freq * 0.5];
            const baseAmps = [0.6, 0.25, 0.1, 0.2];

            baseFreqs.forEach((f, i) => {
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(f, audioCtx.currentTime);
                
                const amplitude = baseAmps[i] * Math.min(intensity, 1);
                gainNode.gain.setValueAtTime(amplitude, audioCtx.currentTime);
                
                osc.connect(gainNode);
                gainNode.connect(masterGain);
                osc.start(audioCtx.currentTime);
                
                oscillators.push({ osc, gainNode });
            });
        }

        function stopNote() {
            oscillators.forEach(item => {
                try {
                    item.osc.stop(audioCtx.currentTime);
                    item.gainNode.disconnect();
                } catch (e) {}
            });
            oscillators = [];
        }

        function drawWave(data) {
            ctx.fillStyle = 'rgba(0, 255, 150, 0.03)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = 'rgba(0, 255, 150, 0.7)';
            ctx.lineWidth = 2;
            ctx.beginPath();

            const sliceWidth = canvas.width / data.length;
            let x = 0;

            for (let i = 0; i < data.length; i++) {
                const v = data[i] / 128;
                const y = (v * canvas.height) / 2;
                
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
                
                x += sliceWidth;
            }

            ctx.lineTo(canvas.width, canvas.height / 2);
            ctx.stroke();
        }

        function checkMic() {
            if (!isActive || !analyser) return;

            const data = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(data);

            let sum = 0;
            for (let i = 0; i < data.length; i++) sum += data[i];
            const intensity = (sum / data.length) / 256;

            airFill.style.width = (intensity * 100) + '%';
            airflowDiv.textContent = `Air: ${(intensity * 100).toFixed(0)}%`;

            if (intensity > 0.12) {
                const notes = [262, 294, 330, 349, 392, 440, 494, 523];
                const idx = Math.min(Math.floor(intensity * 8), 7);
                const freq = notes[idx];

                playNote(freq, intensity);
                freqDiv.textContent = `🎵 ${Math.round(freq)} Hz`;
                statusDiv.textContent = '🎵 Playing...';

                holes.forEach((h, i) => {
                    if (i === idx) h.classList.add('active');
                    else h.classList.remove('active');
                });

                micContainer.classList.add('active');
                rings.forEach(r => r.classList.add('active'));
            } else {
                stopNote();
                holes.forEach(h => h.classList.remove('active'));
                freqDiv.textContent = '';
                statusDiv.textContent = 'Blow into mic...';
                micContainer.classList.remove('active');
                rings.forEach(r => r.classList.remove('active'));
            }

            drawWave(data);
            requestAnimationFrame(checkMic);
        }

        startBtn.addEventListener('click', async () => {
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: false
                    }
                });

                const source = audioCtx.createMediaStreamSource(mediaStream);
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 2048;
                source.connect(analyser);

                isActive = true;
                startBtn.disabled = true;
                stopBtn.disabled = false;
                statusDiv.textContent = 'Blow into mic...';

                checkMic();
            } catch (err) {
                statusDiv.textContent = '❌ Mic access denied';
                console.error('Mic error:', err);
            }
        });

        stopBtn.addEventListener('click', () => {
            isActive = false;
            stopNote();
            if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());

            startBtn.disabled = false;
            stopBtn.disabled = true;
            statusDiv.textContent = 'Ready to blow';
            freqDiv.textContent = '';
            airflowDiv.textContent = 'Air: 0%';
            airFill.style.width = '0%';
            holes.forEach(h => h.classList.remove('active'));
            micContainer.classList.remove('active');
            rings.forEach(r => r.classList.remove('active'));

            ctx.clearRect(0, 0, canvas.width, canvas.height);
        });

        holes.forEach(hole => {
            hole.addEventListener('click', () => {
                const freq = parseFloat(hole.getAttribute('data-freq'));
                playNote(freq, 0.7);
                freqDiv.textContent = `Note: ${hole.getAttribute('data-note')}`;
                setTimeout(stopNote, 200);
            });
        });
    </script>
</body>
</html>
